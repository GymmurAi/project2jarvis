<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.3">
    <animate attributeName="stroke-dasharray" from="0,565" to="565,0" dur="2s" fill="freeze"/>
  </circle>
  <!-- Rotating arc -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="140 425">
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="8s" repeatCount="indefinite"/>
  </circle>
  <!-- Inner hexagon -->
  <polygon points="100,25 155,56.25 155,118.75 100,150 45,118.75 45,56.25" fill="none" stroke="#F59E0B" stroke-width="2" filter="url(#glow)">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </polygon>
  <!-- P2J text -->
  <text x="100" y="95" text-anchor="middle" font-family="Inter, sans-serif" font-size="24" font-weight="800" fill="#F59E0B" filter="url(#glow)">P2J</text>
  <text x="100" y="120" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#10B981">JARVIS</text>
  <!-- Center dot -->
  <circle cx="100" cy="100" r="4" fill="#10B981">
    <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
